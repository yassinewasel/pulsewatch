services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulsewatch}:${POSTGRES_PASSWORD:-pulsewatch_dev_password}@db:5432/${POSTGRES_DB:-pulsewatch}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
